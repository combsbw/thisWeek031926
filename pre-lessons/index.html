function chapterPct(id){
  const s = window.PreLessonStore(id);
  const keys = ["shape","folders","sort","traps","hooks","quiz"];
  let done = 0;
  keys.forEach(k => { if(s.get("done:"+k, false)) done++; });
  return Math.round(done/keys.length*100);
}

const CHAPTERS = [
  { id:"ch1", num:1, title:"Intro to Biology", sub:"Four folders, one idea", href:"chapter-1.html" },
  { id:"ch2", num:2, title:"Chemistry 101", sub:"Water's polarity is the hub", href:"chapter-2.html" },
  { id:"ch3", num:3, title:"Chemistry of Life", sub:"One template, applied 4×", href:"chapter-3.html" },
  { id:"ch4", num:4, title:"Cell Biology", sub:"Two halves: organelles + DNA", href:"chapter-4.html" }
];

function buildHubExtras(root){
  // ----- Unit Passport -----
  const passSec = document.createElement("div");
  passSec.className = "section";
  passSec.innerHTML = `<div class="section-head">
      <div class="section-eyebrow">Your Progress</div>
      <div class="section-title">Unit 1 Passport</div>
      <p class="section-desc">Every stamp fills in as you work through a pre-lesson. Come back any time — your progress is saved on this device.</p>
    </div>`;
  const passport = document.createElement("div");
  passport.className = "passport";
  const stampDefs = [{id:"unit", num:"U", title:"Unit 1"}].concat(
    CHAPTERS.map(c => ({id:c.id, num:c.num, title:"Ch "+c.num}))
  );
  stampDefs.forEach(sd=>{
    const pct = chapterPct(sd.id);
    const stamp = document.createElement("div");
    stamp.className = "stamp" + (pct===100 ? " complete" : "");
    stamp.innerHTML = `<div class="stamp-ring" style="--pct:${pct}"><span>${pct===100 ? "✓" : sd.num}</span></div>
      <div class="stamp-label">${sd.title}</div>`;
    passport.appendChild(stamp);
  });
  passSec.appendChild(passport);
  root.appendChild(passSec);

  // ----- Chapter pipeline -----
  const pipeSec = document.createElement("div");
  pipeSec.className = "section";
  pipeSec.innerHTML = `<div class="section-head">
      <div class="section-eyebrow">The Unit 1 Pipeline</div>
      <div class="section-title">One continuous line, four chapters</div>
      <p class="section-desc">What makes something alive → the inorganic chemistry underneath it → the organic chemistry built from that → the cell structure built from those molecules. Each chapter is a prerequisite for the next.</p>
    </div>`;
  const pipeline = document.createElement("div");
  pipeline.className = "pipeline";
  CHAPTERS.forEach((c, i)=>{
    const pct = chapterPct(c.id);
    const s = window.PreLessonStore(c.id);
    const xp = s.get("xp", 0);
    const card = document.createElement("a");
    card.className = "pipe-card";
    card.href = c.href;
    card.innerHTML = `
      <div class="pipe-num">${c.num}</div>
      <div class="pipe-body">
        <div class="pipe-title">${c.title}</div>
        <div class="pipe-sub">${c.sub} · ⭐ ${xp} XP</div>
        <div class="pipe-bar"><div class="pipe-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="pipe-pct">${pct}%</div>`;
    pipeline.appendChild(card);
    if(i < CHAPTERS.length - 1){
      const arrow = document.createElement("div");
      arrow.className = "pipe-arrow-row";
      arrow.textContent = "↓ builds into ↓";
      pipeline.appendChild(arrow);
    }
  });
  pipeSec.appendChild(pipeline);
  root.appendChild(pipeSec);
}
